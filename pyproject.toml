[project]
name = "file-sorter"
version = "0.1.0"
description = "Автоматическая сортировка файлов по папкам для Linux и Windows"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "platformdirs==4.13.3",
    "watchdog==6.0.0",
]

[project.scripts]
file-sorter = "file_sorter.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
